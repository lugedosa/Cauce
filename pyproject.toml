[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cauce-lang"
version = "0.1.0"
description = "Lenguaje experimental de celdas puras y salida validada"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
cauce = "cauce.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cauce*"]
